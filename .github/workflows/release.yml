name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gjs gnome-shell libglib2.0-bin python3-pil zip unzip

      - name: Verify tag matches extension version
        run: |
          metadata_version="$(python3 -c 'import json; print(json.load(open("metadata.json", encoding="utf-8"))["version"])')"
          test "${GITHUB_REF_NAME}" = "v${metadata_version}"

      - name: Run checks and build
        run: |
          make check
          make pack

      - name: Verify release artifacts
        run: |
          test -f dist/agents-tray-limits@realleo.zip
          test -f dist/agents-tray-limits@realleo.zip.sha256
          unzip -t dist/agents-tray-limits@realleo.zip
          grep -F 'agents-tray-limits@realleo.zip' dist/agents-tray-limits@realleo.zip.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/agents-tray-limits@realleo.zip
            dist/agents-tray-limits@realleo.zip.sha256
