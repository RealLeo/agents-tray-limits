name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gjs gnome-shell libglib2.0-bin zip unzip

      - name: Run checks
        run: make check

      - name: Build release archive
        run: make pack

      - name: Verify release artifacts
        run: |
          test -f dist/agents-tray-limits@realleo.zip
          test -f dist/agents-tray-limits@realleo.zip.sha256
          unzip -t dist/agents-tray-limits@realleo.zip
          grep -F 'agents-tray-limits@realleo.zip' dist/agents-tray-limits@realleo.zip.sha256

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agents-tray-limits
          if-no-files-found: error
          path: |
            dist/agents-tray-limits@realleo.zip
            dist/agents-tray-limits@realleo.zip.sha256
